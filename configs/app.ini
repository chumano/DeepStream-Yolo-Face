[settings]
# Source streams (semicolon-separated for multiple sources)
#sources=file:///path/to/video1.mp4;file:///path/to/video2.mp4
sources=file:///app/videos/faces_tracking.mp4

# Inference configuration
infer-config=/app/configs/config_infer_primary_yoloV8_face.txt

# Stream multiplexer settings
streammux-batch-size=1
streammux-width=1920
streammux-height=1080
gpu-id=0
perf-measurement-interval=5

# Kafka settings
kafka-broker=kafka:29092
kafka-topic=face-detections
kafka-delay=2.0
kafka-quality-threshold=0.005
kafka-sent-record-ttl=60.0
kafka-pending-ttl=10.0
kafka-cleanup-interval=30.0

# Face quality thresholds
min-landmark-confidence=0.5
min-visible-landmarks=3
face-quality-threshold=0.6
min-frontal-score=0.7

# Feature flags
enable-crop-image=false
disable-display=false
enable-frame-save=true
frame-save-dir=/app/outputs/frames
frame-save-quality=60
wait-for-user-input=true