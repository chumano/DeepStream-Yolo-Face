# =============================================================================
# DeepStream Face App — single-source configuration
# Section keys map 1-to-1 with AppConfig structs in src/modules/config.h
# =============================================================================

# ── General application settings ─────────────────────────────────────────────
[app]
gpu-id=0
perf-measurement-interval=60
wait-for-user-input=false
enable-crop-image=false

# ── Frame saving ──────────────────────────────────────────────────────────────
[frame_save]
enabled=false
dir=/app/outputs/frames
# JPEG quality 0–100
quality=60
exclude-letterbox=false

# Saving mode (three mutually-exclusive behaviours):
#   save-all-frames=true   → save every frame regardless of detections
#               false (default)   → smart-save: only save the frame when at least
#                                   one face is detected in it
save-all-frames=false
# Seconds of frames to keep in the pre-detection ring buffer (per source)
pre-buffer-duration=1

# ── Per-frame JSON output ─────────────────────────────────────────────────────
[json_save]
enabled=false
dir=/app/outputs/json

# ── Video sources ─────────────────────────────────────────────────────────────
# List one URI per line as a semicolon-separated GLib string-list value.
[sources]
uris=file:///app/videos/faces_tracking.mp4

# ── Stream multiplexer (nvstreammux) ─────────────────────────────────────────
[streammux]
batch-size=1
width=640
height=640
enable-padding=true
batched-push-timeout=25000

# ── Inference engine (nvinfer / nvinferserver) ───────────────────────────────
[infer]
config-file=/app/configs/config_infer_primary_yoloV8_face.txt
use-triton=false
qos=false

# ── Object tracker (nvtracker) ───────────────────────────────────────────────
[tracker]
width=640
height=384
ll-lib-file=/opt/nvidia/deepstream/deepstream/lib/libnvds_nvmultiobjecttracker.so
ll-config-file=/opt/nvidia/deepstream/deepstream/samples/configs/deepstream-app/config_tracker_NvDCF_perf.yml
display-tracking-id=true

# ── On-screen display (nvdsosd) ──────────────────────────────────────────────
[osd]
# process-mode: 0=CPU  1=GPU
process-mode=1
# Handle Quality-of-Service events 
qos=false
draw-landmarks=true
draw-custom-bbox=true

# ── Display sink (nveglglessink / nv3dsink) ───────────────────────────────────
[display]
disabled=false
window-width=400
window-height=400
sync=false
async=false
qos=false

# ── Queue elements (queue_display and queue_app share these settings) ─────────
[queue]
max-size-buffers=5
# leaky: 0=no-leak  1=upstream  2=downstream
leaky=2

# ── AppSink element ───────────────────────────────────────────────────────────
[appsink]
max-buffers=5
drop=true
sync=false

# ── Kafka / detection manager ────────────────────────────────────────────────
[kafka]
broker=kafka:29092
topic=face-detections
# Optional separate topic for one-shot events (smart_record_done, etc.).
# If omitted, events fall back to the main topic above.
event-topic=events
delay=2.0
quality-threshold=0.005
sent-record-ttl=60.0
pending-ttl=10.0
cleanup-interval=30.0

# ── Face quality thresholds ───────────────────────────────────────────────────
[face_quality]
min-landmark-confidence=0.5
min-visible-landmarks=3
face-quality-threshold=0.6
min-frontal-score=0.7

# ── OSD text overlay ──────────────────────────────────────────────────────────
[osd_text]
max-display-len=128
ntp-text-x-offset=30
ntp-text-y-offset=30
ntp-text-font-size=20

# ── Smart Record (nvurisrcbin, RTSP sources only) ─────────────────────────────
# When enabled, nvurisrcbin is configured with a ring-cache and recordings are
# triggered automatically whenever the inference engine detects one or more
# objects in a frame (num_obj_meta > 0).
[smart_record]
enabled=false
# Directory where recording files are written
dir=/app/outputs/smart_record
# Filename prefix (default used by nvurisrcbin when not set: "Smart_Record")
file-prefix=SR
# Ring-cache depth in seconds (pre-event buffer kept in memory)
cache-size=30
# Maximum recording length in seconds before auto-stop (0 = never auto-stop)
default-duration=20
# Container format: 0 = MP4, 1 = MKV
container=0

# ── File Cleanup (automatic deletion of old files) ────────────────────────────
# Periodically scans frame_save.dir, smart_record.dir, and json_save.dir
# directories and deletes files older than max-age seconds.
[file_cleanup]
enabled=true
# How often to check for old files (in seconds)
interval=300
# Maximum file age (in seconds); files older than this are deleted
max-age=600

# ── RTSP connection and timeout ────────────────────────────────────────────────
# nvurisrcbin-level reconnect settings (apply to the bin element itself).
[rtsp]
# Seconds between reconnect attempts when the stream drops (nvurisrcbin)
reconnect-interval=15
# Number of reconnect attempts; -1 = unlimited
reconnect-attempts=-1
# Whether rtspsrc sends RTCP keep-alive packets
do-keep-alive=false
# RTSP server response timeout in seconds (rtspsrc)
timeout=10
# TCP socket timeout in seconds (rtspsrc)
tcp-timeout=5
# rtspsrc-level retry count before escalating to a bus ERROR
retry=10
# Allowed lower transport protocols (GstRTSPLowerTrans flags, integer sum):
#   1 = udp   2 = udp-mcast   4 = tcp   (default 7 = all three)
# Use 4 to force TCP-only (more reliable through NAT / firewalls)
protocols=4

# ── Performance monitor & exit on stall ────────────────────────────────────────
# Automatically exit the application if any stream's FPS drops to zero and
# remains at zero for the configured timeout duration (useful for detecting
# pipeline stalls, frozen streams, or unrecoverable errors).
[perf_monitor]
# Enable automatic exit on zero FPS stall
enabled=true
# Number of seconds a stream's FPS can remain at zero before exiting (default: 60)
zero-fps-timeout=60
