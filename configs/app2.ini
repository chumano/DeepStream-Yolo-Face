# =============================================================================
# DeepStream Face App — single-source configuration
# Section keys map 1-to-1 with AppConfig structs in src/modules/config.h
# =============================================================================

# ── General application settings ─────────────────────────────────────────────
[app]
gpu-id=0
perf-measurement-interval=5
wait-for-user-input=true
enable-crop-image=false

# ── Frame saving ──────────────────────────────────────────────────────────────
[frame_save]
enabled=false
dir=/app/outputs/frames
# JPEG quality 0–100
quality=60

# save-all-frames=false  → smart-save (only on detection)
save-all-frames=false
pre-buffer-duration=1.0

# ── Per-frame JSON output ─────────────────────────────────────────────────────
[json_save]
enabled=true
dir=/app/outputs/json

# ── Video sources ─────────────────────────────────────────────────────────────
# List one URI per line as a semicolon-separated GLib string-list value.
[sources]
uris=file:///app/videos/faces_tracking.mp4

# ── Stream multiplexer (nvstreammux) ─────────────────────────────────────────
[streammux]
batch-size=1
width=1920
height=1080
batched-push-timeout=25000

# ── Inference engine (nvinfer / nvinferserver) ───────────────────────────────
[infer]
config-file=/app/configs/config_infer_primary_yoloV8_face.txt
use-triton=false
qos=false

[infer2]
config-file=/app/configs/config_infer_primary_traffic_triton.txt
use-triton=true
qos=false

# ── Object tracker (nvtracker) ───────────────────────────────────────────────
[tracker]
width=640
height=384
ll-lib-file=/opt/nvidia/deepstream/deepstream/lib/libnvds_nvmultiobjecttracker.so
ll-config-file=/opt/nvidia/deepstream/deepstream/samples/configs/deepstream-app/config_tracker_NvDCF_perf.yml
display-tracking-id=true

# ── On-screen display (nvdsosd) ──────────────────────────────────────────────
[osd]
# process-mode: 0=CPU  1=GPU
process-mode=1
qos=false

# ── Display sink (nveglglessink / nv3dsink) ───────────────────────────────────
[display]
disabled=false
nvsink-disabled=false
window-width=400
window-height=400
sync=false
async=false
qos=false

# ── Queue elements (queue_display and queue_app share these settings) ─────────
[queue]
max-size-buffers=5
# leaky: 0=no-leak  1=upstream  2=downstream
leaky=2

# ── AppSink element ───────────────────────────────────────────────────────────
[appsink]
max-buffers=5
drop=true
sync=false

# ── Kafka / detection manager ────────────────────────────────────────────────
[kafka]
broker=kafka:29092
topic=face-detections
delay=2.0
quality-threshold=0.005
sent-record-ttl=60.0
pending-ttl=10.0
cleanup-interval=30.0

# ── Face quality thresholds ───────────────────────────────────────────────────
[face_quality]
min-landmark-confidence=0.5
min-visible-landmarks=3
face-quality-threshold=0.6
min-frontal-score=0.7

# ── OSD text overlay ──────────────────────────────────────────────────────────
[osd_text]
max-display-len=128
ntp-text-x-offset=30
ntp-text-y-offset=30
ntp-text-font-size=20

# ── RTSP connection and timeout ────────────────────────────────────────────────
# nvurisrcbin-level reconnect settings (apply to the bin element itself).
[rtsp]
# Seconds between reconnect attempts when the stream drops (nvurisrcbin)
reconnect-interval=15
# Number of reconnect attempts; -1 = unlimited
reconnect-attempts=-1
# Whether rtspsrc sends RTCP keep-alive packets
do-keep-alive=false
# RTSP server response timeout in seconds (rtspsrc)
timeout=10
# TCP socket timeout in seconds (rtspsrc)
tcp-timeout=5
# rtspsrc-level retry count before escalating to a bus ERROR
retry=10
# Allowed lower transport protocols (GstRTSPLowerTrans flags, integer sum):
#   1 = udp   2 = udp-mcast   4 = tcp   (default 7 = all three)
# Use 4 to force TCP-only (more reliable through NAT / firewalls)
protocols=4

